# Formato del export de cada banco. Fuente de verdad de la ingesta.
#
# Un banco nuevo es una entrada acá, no código. Ver docs/conciliacion.md.
# Las claves (banco_sintetico) son las que se guardan en la base: no renombrar
# un banco que ya tiene estados importados.
#
# Por banco:
#   nombre          cómo se muestra.
#   codificacion    utf-8 (con o sin BOM), latin-1 o cp1252. Por defecto utf-8.
#   delimitador     un carácter. Por defecto ",".
#   filas_a_saltar  líneas antes del encabezado. Por defecto 0.
#   columnas        nombre exacto de cada columna en el encabezado: fecha,
#                   descripcion, y el monto como `monto` (una columna con signo)
#                   o como `debito` y `credito` (dos columnas sin signo).
#                   `saldo` es opcional: el saldo después de cada movimiento.
#   formato_fecha   formato de strptime, con %d, %m y %Y.
#   decimal         punto o coma. Nunca se adivina, y no hay separador de miles.
#   signo           negativo_sale (por defecto) o positivo_sale (una tarjeta).
#   cuentas         etiquetas de cuenta que se aceptan ("ahorros", "visa"):
#                   minúsculas y nunca el número. Una que no esté se rechaza.
#   tipos           reglas en orden que asignan movimientos.tipo; gana la primera.
#                   `contiene` son frases completas, sin distinguir tildes ni
#                   mayúsculas; `signo` (sale o entra) es opcional. Si ninguna
#                   coincide: lo que sale es debito y lo que entra, credito.
#
# bancos_pdf: los bancos que exportan PDF con texto (G1b). Por banco, además de
# nombre, cuentas y tipos (igual que arriba):
#   encabezados     rótulo exacto de cada columna del detalle. La x de cada
#                   columna se lee del rótulo en cada página, no se fija acá.
#   resumen         rótulo exacto de cada dato de la página 1: cortes, saldos,
#                   créditos y débitos (con su conteo entre paréntesis) e interés.
#   formato_corte   formato de strptime de las fechas de corte, con año.
#   meses           abreviatura de cada mes en el detalle, de enero a diciembre.
#                   El año sale del periodo, nunca se deduce de otra cosa.
#   rotulo_cuenta   lo que va antes del número de cuenta. El número se compara
#                   entre páginas y se cambia por su etiqueta con CUENTAS_LOCALES
#                   del .env: nunca se guarda ni va al repo.
#   titulo          el título de cada página; una página con solo esto y su pie
#                   es la página vacía del final.
#
# palabras_genericas (una lista para todos los bancos): palabras que no
# distinguen un comercio de otro. Una palabra en común solo desempata entre dos
# candidatos del cruce si NO está en esta lista. La regla de cruce por
# descripción (monto_y_descripcion) pide dos palabras en común, o una sola si
# no está acá. Van sin tildes; solo cuentan palabras de cuatro letras o más.
#
# regla_descripcion: enciende la regla de cruce monto_y_descripcion (mismo
# monto, hasta 10 días y descripción parecida). Apagada por defecto: no tiene
# ningún par correcto medido y unió tres pares falsos por palabras vacías
# ("para", "quito", "compra online"). No encenderla sin una medición nueva
# (docs/conciliacion.md).
#
# Los dos bancos de `bancos` son inventados: los usan los tests y
# scripts/estado_sintetico.py. Pichincha (en `bancos_pdf`) es real: G0 dijo que
# solo exporta PDF.

tope_bytes: 1048576 # 1 MiB; un estado mensual en CSV pesa unos pocos KB
tope_filas: 2000 # movimientos por estado; uno mensual trae decenas
tope_monto: 100000 # dólares por movimiento; más que esto es un signo o un separador mal leído

regla_descripcion: false

# Vocabulario de cualquier estado de cuenta, no de un comercio. Se fijó antes de
# medir el cruce (docs/conciliacion.md) y no se ajusta mirando la medición.
palabras_genericas:
  - compra
  - compras
  - pago
  - pagos
  - debito
  - credito
  - tienda
  - tarjeta
  - consumo
  - cargo
  - cuota
  - abono
  - transferencia
  - retiro
  - cajero
  - deposito
  - banco
  - cuenta
  - comercio
  - servicio
  - servicios
  - factura
  - recibo
  - online
  - internet
  - nacional
  - internacional

bancos:
  # Con columna de saldo: se verifica fila por fila.
  banco_sintetico:
    nombre: Banco Sintético
    columnas:
      fecha: Fecha
      descripcion: Descripción
      monto: Monto
      saldo: Saldo
    formato_fecha: "%d/%m/%Y"
    decimal: punto
    cuentas: [ahorros, visa]
    tipos:
      - tipo: comision
        contiene: [comision, mantenimiento de cuenta, costo de chequera]
        signo: sale
      - tipo: interes
        contiene: [interes, intereses]
      - tipo: pago
        contiene: [pago tarjeta, pago de tarjeta]
        signo: sale

  # Sin columna de saldo, con coma decimal, punto y coma, débito y crédito
  # aparte y dos líneas de título antes del encabezado.
  banco_sintetico_coma:
    nombre: Banco Sintético (coma decimal)
    delimitador: ";"
    filas_a_saltar: 2
    columnas:
      fecha: Fecha
      descripcion: Detalle
      debito: Débito
      credito: Crédito
    formato_fecha: "%Y-%m-%d"
    decimal: coma
    cuentas: [ahorros]
    tipos:
      - tipo: comision
        contiene: [comision, mantenimiento de cuenta]
        signo: sale
      - tipo: interes
        contiene: [interes, intereses]

bancos_pdf:
  # El formato se midió una vez sobre un estado real, en local, sin copiar su
  # contenido; los tests corren contra PDF sintéticos (docs/conciliacion.md).
  pichincha:
    nombre: Banco Pichincha
    cuentas: [ahorros]
    encabezados:
      fecha: FECHA
      oficina: OFIC.
      documento: N.DOC.
      descripcion: DESCRIPCION
      debito: DEBITO
      credito: CREDITO
      saldo: SALDO
    resumen:
      ultimo_corte: FECHA ÚLTIMO CORTE (FACTURA)
      este_corte: FECHA ESTE CORTE
      saldo_anterior: SALDO ANTERIOR
      creditos: DEPÓSITO / CRÉDITOS
      debitos: CHEQUES / DÉBITOS
      interes: INTERÉS PERIODO
      saldo_final: SALDO ACTUAL
    formato_corte: "%d-%m-%Y"
    meses: [ene., feb., mar., abr., may., jun., jul., ago., sep., oct., nov., dic.]
    rotulo_cuenta: CUENTA
    titulo: ESTADO DE CUENTA
    tipos:
      - tipo: comision
        contiene: [comision]
        signo: sale
      - tipo: interes
        contiene: [interes, intereses]
